name: 教育自治体情報 平日朝9時収集・配信

on:
  schedule:
    # JST 9:00 = UTC 0:00. 平日のみ (月-金)
    - cron: '0 0 * * 1-5'
  workflow_dispatch: {}  # 手動実行も可能

jobs:
  collect-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # data/ と site/ の更新コミットのため
      pages: write      # GitHub Pagesデプロイ
      id-token: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 依存ライブラリインストール
        run: pip install -r requirements.txt

      - name: 情報収集 + 要約 (Claude API使用)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python scripts/collect.py

      - name: まとめサイト生成
        run: python scripts/render_site.py

      - name: メール送信
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/send_email.py --send

      - name: 状態をリポジトリに保存
        run: |
          git config user.name "edu-intel-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ state/ site/
          git diff --staged --quiet || git commit -m "daily: $(date +%Y-%m-%d)"
          git push

      - name: GitHub Pagesアップロード準備
        uses: actions/configure-pages@v4

      - name: site/ をPagesにアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pagesにデプロイ
        uses: actions/deploy-pages@v4
